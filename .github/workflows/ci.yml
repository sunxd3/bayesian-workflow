name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Pinned so the integration job is reproducible and its cache key is stable.
  CMDSTAN_VERSION: "2.39.0"

jobs:
  validate:
    name: Validate plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: claude plugin validate --strict
        run: claude plugin validate . --strict

  workflow-scripts:
    name: Workflow scripts parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: node --check (body wrapped like the Workflow runtime)
        # Workflow scripts use top-level `return` and `await`, which plain ESM
        # rejects — wrap the body the way the runtime does before checking.
        run: |
          set -e
          for f in workflows/*.js; do
            { echo "(async () => {"; sed 's/^export const meta/const meta/' "$f"; echo "})()"; } > /tmp/check.mjs
            node --check /tmp/check.mjs && echo "ok  $f"
          done

  lint-and-types:
    name: Reference scripts lint + types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: tests/uv.lock
      - run: uv sync
      - name: ruff (tests + skills/fit/fit-pipeline/references)
        run: uv run ruff check --config pyproject.toml --output-format=github . ../skills/fit/fit-pipeline/references
      - name: pyright
        run: uv run pyright

  unit-tests:
    name: Reference scripts unit tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: tests/uv.lock
      - run: uv sync
      - name: pytest (synthetic InferenceData, no CmdStan)
        run: uv run pytest -m "not integration" -q

  integration-tests:
    name: Reference scripts against real CmdStan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: tests/uv.lock
      - run: uv sync

      - name: Cache CmdStan toolchain
        id: cmdstan-cache
        uses: actions/cache@v4
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ env.CMDSTAN_VERSION }}-${{ runner.os }}
      - name: Install CmdStan
        if: steps.cmdstan-cache.outputs.cache-hit != 'true'
        run: uv run python -m cmdstanpy.install_cmdstan --version "$CMDSTAN_VERSION" --cores 4

      - name: Cache compiled test models
        id: models-cache
        uses: actions/cache@v4
        with:
          path: tests/stan
          key: stan-models-${{ env.CMDSTAN_VERSION }}-${{ runner.os }}-${{ hashFiles('tests/stan/*.stan') }}
      - name: Mark cached binaries fresh
        if: steps.models-cache.outputs.cache-hit == 'true'
        # Checkout stamps the .stan sources with "now"; CmdStanPy recompiles
        # whenever a source is newer than its binary. Touch the binaries so
        # the cache is actually used.
        run: find stan -type f ! -name '*.stan' -exec touch {} +

      - name: pytest (compile + NUTS via the reference scripts)
        env:
          # A missing toolchain must fail the job, never skip it.
          REQUIRE_CMDSTAN: "1"
        run: uv run pytest -m integration -v --durations=10

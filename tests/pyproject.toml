# Test harness for the plugin's runnable reference code. Not shipped to users.
[project]
name = "bayesian-workflow-tests"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
    "arviz>=0.17.0,<1.0.0",
    "cmdstanpy>=1.2.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    "pytest>=7.4.0",
    "ruff>=0.9.0",
    "pyright>=1.1.400",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = [".", "../skills/fit/fit-pipeline/references"]

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-ra"
markers = [
    "integration: compiles and samples real Stan models via CmdStan (slow; skipped when CmdStan is absent unless REQUIRE_CMDSTAN=1)",
]
